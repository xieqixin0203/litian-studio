<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>立田工作室 LITIAN STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#111;}
  body{
    font-family:"Fira Sans","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .entry{
    position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
  }
  .entry-bg{
    position:absolute;inset:0;z-index:0;
    background-image:url('https://cdn.jsdelivr.net/gh/xieqixin0203/litian-studio@main/images/entry-cover.webp');
    background-size:cover;background-position:center;
    opacity:0.15;
    animation:bgFadeIn 3.5s ease-out forwards;
  }
  @keyframes bgFadeIn{
    from{opacity:0.15;}
    to{opacity:1;}
  }
  .entry::before{
    content:"";position:absolute;inset:0;z-index:1;
    background:rgba(0,0,0,.35);
  }
  .scene{
    position:absolute;inset:0;z-index:2;overflow:hidden;
    pointer-events:none;
  }
  .scene-sky{
    position:absolute;top:0;left:0;right:0;height:55%;
    background:linear-gradient(180deg,
      rgba(1,5,13,.78) 0%,
      rgba(10,22,40,.6) 60%,
      rgba(13,31,58,.5) 100%);
  }
  .scene-sea{
    position:absolute;bottom:0;left:0;right:0;height:45%;
    background:linear-gradient(180deg,
      rgba(13,31,58,.5) 0%,
      rgba(6,16,34,.72) 100%);
    overflow:hidden;
  }
  .moon-wrap{
    position:absolute;left:50%;bottom:45%;
    transform:translateX(-50%);
    width:clamp(110px,20vw,200px);
    z-index:3;pointer-events:none;
    animation:moonRise 4s cubic-bezier(0.17,0.67,0.83,0.67) forwards;
    filter:drop-shadow(0 0 40px rgba(255,240,180,.55))
           drop-shadow(0 0 100px rgba(255,220,130,.3));
  }
  .moon-body{
    width:100%;
    height:auto;
    display:block;
  }
  @keyframes moonRise{
    0%{bottom:38%;opacity:0;transform:translateX(-50%) scale(.6);}
    30%{opacity:1;}
    100%{bottom:62%;opacity:1;transform:translateX(-50%) scale(1);}
  }
  .moon-reflection{
    position:absolute;left:50%;bottom:0;
    transform:translateX(-50%) scaleY(-0.5);
    width:clamp(110px,20vw,200px);
    height:clamp(55px,10vw,100px);
    border-radius:50%;
    background:radial-gradient(ellipse at center,
      rgba(255,240,180,.4) 0%,transparent 70%);
    filter:blur(12px);
    z-index:2;pointer-events:none;
    animation:reflectionFade 4s ease-out forwards;
  }
  @keyframes reflectionFade{
    0%{opacity:0;}
    60%{opacity:0;}
    100%{opacity:.65;}
  }
  .star{
    position:absolute;border-radius:50%;
    background:#ffffff;
    opacity:0;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.95;}
  }
  .festival-text{
    position:absolute;bottom:25%;left:0;right:0;z-index:5;
    text-align:center;
    font-size:clamp(.9rem,1.8vw,1.3rem);
    letter-spacing:.3em;
    color:#ffffff;
    text-shadow:0 2px 16px rgba(0,0,0,.7),
                0 0 30px rgba(255,220,120,.35);
    font-weight:400;
    opacity:0;
    animation:festivalFadeIn 3s ease-out 2s forwards;
    padding:0 20px;
    pointer-events:none;
  }
  @keyframes festivalFadeIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .entry-content{
    position:relative;z-index:6;
    padding:0 20px;
    text-align:center;
    transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;
  }
  .entry:hover .entry-content{transform:scale(1.03);opacity:.92;}
  .entry-title{
    display:flex;flex-direction:column;align-items:center;
    text-decoration:none;
  }
  .entry-title .cn{
    font-size:clamp(1.8rem,5vw,3.6rem);
    font-weight:600;letter-spacing:.06em;line-height:1.15;
    color:#ffffff;
    text-shadow:0 2px 20px rgba(0,0,0,.45);
  }
  .entry-title .en{
    font-size:clamp(.68rem,1.2vw,.82rem);
    font-weight:400;letter-spacing:.36em;
    color:rgba(255,255,255,.85);
    text-shadow:0 1px 8px rgba(0,0,0,.4);
    margin-top:14px;white-space:nowrap;
  }
  .entry-sub{
    margin-top:18px;
    font-size:clamp(.62rem,1.1vw,.72rem);
    letter-spacing:.18em;
    color:rgba(255,255,255,.5);
    text-shadow:0 1px 6px rgba(0,0,0,.4);
    font-weight:300;text-align:center;
  }
</style>
</head>
<body>
<a class="entry" href="work.html">
  <div class="entry-bg"></div>
  <div class="scene">
    <div class="scene-sky"></div>
    <div class="scene-sea">
      <div class="moon-reflection"></div>
    </div>
    <div class="star" style="top:8%;left:12%;width:2px;height:2px;animation-delay:0s;"></div>
    <div class="star" style="top:15%;left:28%;width:3px;height:3px;animation-delay:1.2s;"></div>
    <div class="star" style="top:5%;left:45%;width:2px;height:2px;animation-delay:2.5s;"></div>
    <div class="star" style="top:20%;left:62%;width:2px;height:2px;animation-delay:0.8s;"></div>
    <div class="star" style="top:10%;left:78%;width:3px;height:3px;animation-delay:1.8s;"></div>
    <div class="star" style="top:25%;left:88%;width:2px;height:2px;animation-delay:3.2s;"></div>
    <div class="star" style="top:32%;left:18%;width:2px;height:2px;animation-delay:2s;"></div>
    <div class="star" style="top:28%;left:52%;width:2px;height:2px;animation-delay:0.5s;"></div>
    <div class="star" style="top:35%;left:72%;width:2px;height:2px;animation-delay:2.8s;"></div>
    <div class="star" style="top:18%;left:35%;width:2px;height:2px;animation-delay:1.5s;"></div>
    <div class="moon-wrap">
      <img class="moon-body" src="https://cdn.jsdelivr.net/gh/xieqixin0203/litian-studio@main/images/moon.webp?v=2" alt="月亮">
    </div>
  </div>
  <div class="festival-text">中秋佳节，人月两团圆</div>
  <div class="entry-content">
    <div class="entry-title">
      <span class="cn">立田工作室</span>
      <span class="en">LITIAN STUDIO</span>
    </div>
    <div class="entry-sub">SDADI 顺德建筑设计院股份有限公司</div>
  </div>
</a>
</body>
</html>
