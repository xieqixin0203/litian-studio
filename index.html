<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>立田工作室 LITIAN STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#111;}
  body{font-family:"Fira Sans","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .entry{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .entry-bg{position:absolute;inset:0;z-index:0;
    background-image:url('https://cdn.jsdelivr.net/gh/xieqixin0203/litian-studio@main/images/entry-cover.webp');background-size:cover;background-position:center;
    opacity:0.15;animation:bgFadeIn 3.5s ease-out forwards;}
  @keyframes bgFadeIn{from{opacity:0.15;}to{opacity:1;}}
  .entry::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.35);}
  /* ⚠️ 三行文字容器：位置固定居中，任何节日特效都不得覆盖此处的 transform */
  .entry-content{position:relative;z-index:6;padding:0 20px;text-align:center;
    transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;}
  .entry:hover .entry-content{transform:scale(1.03);opacity:.92;}
  .entry-title{display:flex;flex-direction:column;align-items:center;text-decoration:none;}
  .entry-title .cn{font-size:clamp(1.8rem,5vw,3.6rem);font-weight:600;letter-spacing:.06em;
    line-height:1.15;color:#ffffff;text-shadow:0 2px 20px rgba(0,0,0,.45);}
  .entry-title .en{font-size:clamp(.68rem,1.2vw,.82rem);font-weight:400;letter-spacing:.36em;
    color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.4);margin-top:14px;white-space:nowrap;}
  .entry-sub{margin-top:18px;font-size:clamp(.62rem,1.1vw,.72rem);letter-spacing:.18em;
    color:rgba(255,255,255,.5);text-shadow:0 1px 6px rgba(0,0,0,.4);font-weight:300;text-align:center;}
  
  /* ===== 国庆场景 ===== */
  .nd-scene{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;}

  /* 烟花：中部以上两侧，从中心炸开 8 个粒子 */
  .firework{position:absolute;width:5px;height:5px;border-radius:50%;
    background:#ffe066;opacity:0;}
  .fw1{top:14%;left:10%;animation:explode 2.6s ease-out infinite 0s;}
  .fw2{top:26%;left:20%;animation:explode 3.0s ease-out infinite 1.1s;}
  .fw3{top:9%;right:10%;animation:explode 2.8s ease-out infinite 0.5s;}
  .fw4{top:24%;right:18%;animation:explode 3.2s ease-out infinite 1.7s;}
  .fw5{top:33%;left:5%;animation:explode 2.4s ease-out infinite 2.2s;}
  .fw6{top:31%;right:5%;animation:explode 2.9s ease-out infinite 2.6s;}

  @keyframes explode{
    0%{
      box-shadow:
        0 0 0 0 #ffd700, 0 0 0 0 #ff9f43, 0 0 0 0 #ff6348,
        0 0 0 0 #feca57, 0 0 0 0 #ff6b6b, 0 0 0 0 #ffd93d,
        0 0 0 0 #fff5a0, 0 0 0 0 #ffb347;
      opacity:0;
    }
    12%{opacity:1;}
    55%{opacity:.85;}
    100%{
      box-shadow:
        55px -55px 0 0 #ffd700, -55px -55px 0 0 #ff9f43,
        55px 55px 0 0 #ff6348, -55px 55px 0 0 #feca57,
        75px 0 0 0 #ff6b6b, -75px 0 0 0 #ffd93d,
        0 -75px 0 0 #fff5a0, 0 75px 0 0 #ffb347;
      opacity:0;
    }
  }

  /* 门楼：贴底，小尺寸，绝不碰中央三行文字 */
  .gate-wrap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:clamp(260px,48vw,620px);z-index:3;pointer-events:none;
    animation:gateRise 3.5s cubic-bezier(0.16,1,0.3,1) forwards;
    filter:drop-shadow(0 -8px 30px rgba(255,180,80,.4));}
  .gate-img{width:100%;height:auto;display:block;}
  @keyframes gateRise{
    0%{transform:translateX(-50%) translateY(100%);opacity:0;}
    15%{opacity:1;}
    100%{transform:translateX(-50%) translateY(0);opacity:1;}
  }

  /* 祝福语：夹在三行文字和门楼之间，约屏幕 67% 位置 */
  .festival-text{position:absolute;bottom:33%;left:0;right:0;z-index:5;text-align:center;
    font-size:clamp(1rem,2vw,1.4rem);letter-spacing:.32em;color:#fff5d0;
    text-shadow:0 2px 16px rgba(0,0,0,.8),0 0 30px rgba(255,200,80,.7),0 0 60px rgba(255,100,60,.35);
    font-weight:600;opacity:0;animation:festivalFadeIn 3s ease-out 2.4s forwards;
    padding:0 20px;pointer-events:none;}
  @keyframes festivalFadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  /* ⚠️ 三行文字位置：此处刻意不写任何 .entry-content 的覆盖规则 */

</style>
</head>
<body>
<a class="entry" href="work.html">
  <div class="entry-bg"></div>
  <div class="nd-scene">
    <div class="firework fw1"></div>
    <div class="firework fw2"></div>
    <div class="firework fw3"></div>
    <div class="firework fw4"></div>
    <div class="firework fw5"></div>
    <div class="firework fw6"></div>
    <div class="gate-wrap"><img class="gate-img" src="https://cdn.jsdelivr.net/gh/xieqixin0203/litian-studio@main/images/gate.webp?v=1790756613" alt="国庆门楼"></div>
  </div>
  <div class="festival-text">国庆快乐，家国同庆</div>
  <div class="entry-content">
    <div class="entry-title">
      <span class="cn">立田工作室</span>
      <span class="en">LITIAN STUDIO</span>
    </div>
    <div class="entry-sub">SDADI 顺德建筑设计院股份有限公司</div>
  </div>
</a>
</body>
</html>
