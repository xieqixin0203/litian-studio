<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>立田工作室 LITIAN STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#111;}
  body{
    font-family:"Fira Sans","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .entry{
    position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
  }
  .entry-bg{
    position:absolute;inset:0;z-index:0;
    background-image:url('https://cdn.jsdelivr.net/gh/xieqixin0203/litian-studio@main/images/entry-cover.webp');
    background-size:cover;background-position:center;
    opacity:0.15;
    animation:bgFadeIn 3.5s ease-out forwards;
  }
  @keyframes bgFadeIn{
    from{opacity:0.15;}
    to{opacity:1;}
  }
  .entry::before{
    content:"";position:absolute;inset:0;z-index:1;
    background:rgba(0,0,0,.35);
  }
  .entry-content{
    position:relative;z-index:2;
    padding:0 20px;
    text-align:center;
    transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;
  }
  .entry:hover .entry-content{transform:scale(1.03);opacity:.92;}
  .entry-title{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
  }
  .entry-title .cn{
    font-size:clamp(1.8rem,5vw,3.6rem);
    font-weight:600;letter-spacing:.06em;line-height:1.15;
    color:#ffffff;
    text-shadow:0 2px 20px rgba(0,0,0,.45);
  }
  .entry-title .en{
    font-size:clamp(.68rem,1.2vw,.82rem);
    font-weight:400;letter-spacing:.36em;
    color:rgba(255,255,255,.85);
    text-shadow:0 1px 8px rgba(0,0,0,.4);
    margin-top:14px;
    white-space:nowrap;
  }
  .entry-sub{
    margin-top:18px;
    font-size:clamp(.62rem,1.1vw,.72rem);
    letter-spacing:.18em;
    color:rgba(255,255,255,.5);
    text-shadow:0 1px 6px rgba(0,0,0,.4);
    font-weight:300;
    text-align:center;
  }
  /* 右上角真实月亮图：screen 模式去掉黑底 */
  .entry-moon{
    position:absolute;top:5vh;right:4vw;z-index:2;
    width:clamp(100px,18vw,220px);
    height:auto;
    mix-blend-mode:screen;
    filter:drop-shadow(0 0 28px rgba(255,220,140,.55))
           drop-shadow(0 0 70px rgba(255,200,100,.28));
    animation:moonGlow 8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes moonGlow{
    0%,100%{filter:drop-shadow(0 0 28px rgba(255,220,140,.55))
                    drop-shadow(0 0 70px rgba(255,200,100,.28));
            transform:scale(1);}
    50%{filter:drop-shadow(0 0 42px rgba(255,220,140,.75))
                drop-shadow(0 0 100px rgba(255,200,100,.4));
        transform:scale(1.04);}
  }
  /* 飘动光点 */
  .entry-lantern{
    position:absolute;z-index:3;
    width:5px;height:5px;border-radius:50%;
    background:#ffe89a;
    box-shadow:0 0 8px 2px rgba(255,225,140,.9), 0 0 18px 6px rgba(255,210,100,.5);
    opacity:0;pointer-events:none;
  }
  .entry-lantern.l1{bottom:18%;left:8%;animation:floatUp 14s ease-in infinite 0s;}
  .entry-lantern.l2{bottom:8%;left:20%;animation:floatUp 17s ease-in infinite 2s;}
  .entry-lantern.l3{bottom:5%;left:35%;animation:floatUp 20s ease-in infinite 5s;}
  .entry-lantern.l4{bottom:12%;left:50%;animation:floatUp 15s ease-in infinite 7s;}
  .entry-lantern.l5{bottom:6%;left:65%;animation:floatUp 18s ease-in infinite 3s;}
  .entry-lantern.l6{bottom:15%;left:80%;animation:floatUp 16s ease-in infinite 6s;}
  .entry-lantern.l7{bottom:22%;left:92%;animation:floatUp 22s ease-in infinite 10s;}
  .entry-lantern.l8{bottom:3%;left:10%;animation:floatUp 19s ease-in infinite 9s;}
  .entry-lantern.l9{bottom:20%;left:28%;animation:floatUp 13s ease-in infinite 1s;}
  .entry-lantern.l10{bottom:10%;left:42%;animation:floatUp 21s ease-in infinite 4s;}
  .entry-lantern.l11{bottom:18%;left:58%;animation:floatUp 17s ease-in infinite 8s;}
  .entry-lantern.l12{bottom:9%;left:72%;animation:floatUp 19s ease-in infinite 12s;}
  .entry-lantern.l13{bottom:25%;left:88%;animation:floatUp 14s ease-in infinite 11s;}
  .entry-lantern.l14{bottom:13%;left:3%;animation:floatUp 16s ease-in infinite 13s;}
  .entry-lantern.l15{bottom:7%;left:38%;animation:floatUp 20s ease-in infinite 2.5s;}
  .entry-lantern.l16{bottom:14%;left:25%;animation:floatUp 15s ease-in infinite 5.5s;}
  .entry-lantern.l17{bottom:11%;left:55%;animation:floatUp 18s ease-in infinite 9.5s;}
  .entry-lantern.l18{bottom:19%;left:68%;animation:floatUp 21s ease-in infinite 3.5s;}
  .entry-lantern.l19{bottom:6%;left:85%;animation:floatUp 17s ease-in infinite 14s;}
  .entry-lantern.l20{bottom:23%;left:15%;animation:floatUp 19s ease-in infinite 6.5s;}
  .entry-lantern.l21{bottom:16%;left:45%;animation:floatUp 14s ease-in infinite 11.5s;}
  .entry-lantern.l22{bottom:4%;left:60%;animation:floatUp 20s ease-in infinite 15s;}
  .entry-lantern.l23{bottom:21%;left:78%;animation:floatUp 16s ease-in infinite 7.5s;}
  .entry-lantern.l24{bottom:8%;left:30%;animation:floatUp 22s ease-in infinite 16s;}
  .entry-lantern.l25{bottom:13%;left:95%;animation:floatUp 18s ease-in infinite 10.5s;}
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.5);opacity:0;}
    10%{opacity:1;}
    50%{opacity:.85;}
    90%{opacity:.5;}
    100%{transform:translateY(-78vh) scale(1.1);opacity:0;}
  }
  /* 中秋祝福文字：底部，白色 */
  .entry-festival{
    position:absolute;bottom:8vh;left:0;right:0;z-index:4;
    text-align:center;
    font-size:clamp(1rem,2vw,1.4rem);
    letter-spacing:.3em;
    color:#ffffff;
    text-shadow:0 2px 12px rgba(0,0,0,.6),
                0 0 24px rgba(255,220,140,.35);
    font-weight:400;
    opacity:0;
    animation:festivalFadeIn 3s ease-out 1.5s forwards;
    padding:0 20px;
    pointer-events:none;
  }
  @keyframes festivalFadeIn{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }

</style>
</head>
<body>
<a class="entry" href="work.html">
  <div class="entry-bg"></div>
  <img class="entry-moon" src="https://cdn.jsdelivr.net/gh/xieqixin0203/litian-studio@main/images/moon.webp" alt="月亮">
  <div class="entry-lantern l1"></div>
  <div class="entry-lantern l2"></div>
  <div class="entry-lantern l3"></div>
  <div class="entry-lantern l4"></div>
  <div class="entry-lantern l5"></div>
  <div class="entry-lantern l6"></div>
  <div class="entry-lantern l7"></div>
  <div class="entry-lantern l8"></div>
  <div class="entry-lantern l9"></div>
  <div class="entry-lantern l10"></div>
  <div class="entry-lantern l11"></div>
  <div class="entry-lantern l12"></div>
  <div class="entry-lantern l13"></div>
  <div class="entry-lantern l14"></div>
  <div class="entry-lantern l15"></div>
  <div class="entry-lantern l16"></div>
  <div class="entry-lantern l17"></div>
  <div class="entry-lantern l18"></div>
  <div class="entry-lantern l19"></div>
  <div class="entry-lantern l20"></div>
  <div class="entry-lantern l21"></div>
  <div class="entry-lantern l22"></div>
  <div class="entry-lantern l23"></div>
  <div class="entry-lantern l24"></div>
  <div class="entry-lantern l25"></div>
  <div class="entry-festival">中秋佳节，人月两团圆</div>
  <div class="entry-content">
    <div class="entry-title">
      <span class="cn">立田工作室</span>
      <span class="en">LITIAN STUDIO</span>
    </div>
    <div class="entry-sub">SDADI 顺德建筑设计院股份有限公司</div>
  </div>
</a>
</body>
</html>
