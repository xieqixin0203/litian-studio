<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>立田工作室 LITIAN STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#111;}
  body{
    font-family:"Fira Sans","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .entry{
    position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
  }
  .entry-bg{
    position:absolute;inset:0;z-index:0;
    background-image:url('https://cdn.jsdelivr.net/gh/xieqixin0203/litian-studio@main/images/entry-cover.webp');
    background-size:cover;background-position:center;
    opacity:0.15;
    animation:bgFadeIn 3.5s ease-out forwards;
  }
  @keyframes bgFadeIn{
    from{opacity:0.15;}
    to{opacity:1;}
  }
  .entry::before{
    content:"";position:absolute;inset:0;z-index:1;
    background:rgba(0,0,0,.35);
  }
  .entry-content{
    position:relative;z-index:2;
    padding:0 20px;
    text-align:center;
    transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;
  }
  .entry:hover .entry-content{transform:scale(1.03);opacity:.92;}
  .entry-title{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
  }
  .entry-title .cn{
    font-size:clamp(1.8rem,5vw,3.6rem);
    font-weight:600;letter-spacing:.06em;line-height:1.15;
    color:#ffffff;
    text-shadow:0 2px 20px rgba(0,0,0,.45);
  }
  .entry-title .en{
    font-size:clamp(.68rem,1.2vw,.82rem);
    font-weight:400;letter-spacing:.36em;
    color:rgba(255,255,255,.85);
    text-shadow:0 1px 8px rgba(0,0,0,.4);
    margin-top:14px;
    white-space:nowrap;
  }
  .entry-sub{
    margin-top:18px;
    font-size:clamp(.62rem,1.1vw,.72rem);
    letter-spacing:.18em;
    color:rgba(255,255,255,.5);
    text-shadow:0 1px 6px rgba(0,0,0,.4);
    font-weight:300;
    text-align:center;
  }
  /* 月亮 */
  .entry-moon{
    position:absolute;top:9vh;right:8vw;z-index:2;
    width:clamp(80px,12vw,130px);
    height:clamp(80px,12vw,130px);
    border-radius:50%;
    background:radial-gradient(circle at 38% 35%,#fffdf3 0%,#fff4c8 35%,#f7dc7e 70%,#e8c24a 100%);
    box-shadow:0 0 60px 18px rgba(255,232,150,.35),
               0 0 120px 40px rgba(255,220,120,.15);
    animation:moonGlow 9s ease-in-out infinite;
  }
  @keyframes moonGlow{
    0%,100%{
      box-shadow:0 0 60px 18px rgba(255,232,150,.35),
                 0 0 120px 40px rgba(255,220,120,.15);
      transform:scale(1);
    }
    50%{
      box-shadow:0 0 80px 28px rgba(255,232,150,.5),
                 0 0 160px 55px rgba(255,220,120,.25);
      transform:scale(1.04);
    }
  }
  /* 飘动光点 */
  .entry-lantern{
    position:absolute;z-index:2;
    width:5px;height:5px;border-radius:50%;
    background:#ffe08a;
    box-shadow:0 0 12px 3px rgba(255,217,122,.75);
    opacity:0;pointer-events:none;
  }
  .entry-lantern.l1{bottom:18%;left:16%;animation:floatUp 14s ease-in infinite 0s;}
  .entry-lantern.l2{bottom:8%;left:74%;animation:floatUp 17s ease-in infinite 4s;}
  .entry-lantern.l3{bottom:5%;left:48%;animation:floatUp 20s ease-in infinite 8s;}
  .entry-lantern.l4{bottom:25%;left:30%;animation:floatUp 15s ease-in infinite 2s;}
  .entry-lantern.l5{bottom:12%;left:60%;animation:floatUp 18s ease-in infinite 6s;}
  .entry-lantern.l6{bottom:20%;left:88%;animation:floatUp 16s ease-in infinite 10s;}
  .entry-lantern.l7{bottom:3%;left:35%;animation:floatUp 22s ease-in infinite 12s;}
  .entry-lantern.l8{bottom:15%;left:5%;animation:floatUp 19s ease-in infinite 7s;}
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.6);opacity:0;}
    12%{opacity:.9;}
    80%{opacity:.7;}
    100%{transform:translateY(-72vh) scale(1);opacity:0;}
  }
  /* 中秋祝福文字 */
  .entry-festival{
    position:absolute;top:28%;left:0;right:0;z-index:2;
    text-align:center;
    font-size:clamp(.9rem,1.8vw,1.25rem);
    letter-spacing:.32em;
    color:rgba(255,240,200,.95);
    text-shadow:0 2px 16px rgba(0,0,0,.6),
                0 0 30px rgba(255,220,120,.4);
    font-weight:300;
    opacity:0;
    animation:festivalFadeIn 3s ease-out 1.5s forwards;
    padding:0 20px;
    pointer-events:none;
  }
  @keyframes festivalFadeIn{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }

</style>
</head>
<body>
<a class="entry" href="work.html">
  <div class="entry-bg"></div>
  <div class="entry-moon"></div>
  <div class="entry-lantern l1"></div>
  <div class="entry-lantern l2"></div>
  <div class="entry-lantern l3"></div>
  <div class="entry-lantern l4"></div>
  <div class="entry-lantern l5"></div>
  <div class="entry-lantern l6"></div>
  <div class="entry-lantern l7"></div>
  <div class="entry-lantern l8"></div>
  <div class="entry-festival">中秋佳节，人月两团圆</div>
  <div class="entry-content">
    <div class="entry-title">
      <span class="cn">立田工作室</span>
      <span class="en">LITIAN STUDIO</span>
    </div>
    <div class="entry-sub">SDADI 顺德建筑设计院股份有限公司</div>
  </div>
</a>
</body>
</html>
